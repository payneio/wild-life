[project]
name = "wild-life"
version = "0.1.0"
description = "Wild Life — single-user CRM/Calendar/Journal/Planner backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "pywebpush>=2.3.0",
    "python-dateutil>=2.9.0.post0",
    "fastmcp>=2.11",
    "httpx>=0.27.0",
    # <7: icalendar 7.x has a parameter-parsing regression that crashes on some
    # real Proton invite exports (same pin the calendar-mail sidecar uses).
    "icalendar<7",
    # HTML calendar DESCRIPTIONs -> markdown at ingest (see wild_life/richtext.py).
    # Pure-python, no transitive deps.
    "html2text>=2024.2.26",
    "phonenumbers>=9.0.34",
    "openpyxl>=3.1.5",
]

[project.scripts]
wild-life = "wild_life.main:run"
wild-life-openapi = "wild_life.openapi:main"
wild-life-lifecycle = "wild_life.lifecycle:main"
wild-life-backfill-moments = "wild_life.backfill_moments:main"
wild-life-reverse-moments = "wild_life.reverse_moments:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wild_life"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.ruff.lint.isort]
known-first-party = ["wild_life"]
